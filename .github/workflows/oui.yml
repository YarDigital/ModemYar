name: Update oui.json
on:
  schedule: [{ cron: '0 3 1 * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  oui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download vendor list
        run: |
          curl -fsSL https://raw.githubusercontent.com/nmap/nmap/master/nmap-mac-prefixes -o vendors.txt \
          || curl -fsSL -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36" -H "Accept: text/csv,*/*" https://standards-oui.ieee.org/oui/oui.csv -o vendors.txt
      - run: python3 tools/make_oui.py vendors.txt oui.json
      - uses: actions/upload-artifact@v4
        with:
          name: oui-json
          path: oui.json
      - name: Save oui.json in the repository
        continue-on-error: true
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add oui.json; git diff --cached --quiet || git commit -m "Update oui.json"; git push
